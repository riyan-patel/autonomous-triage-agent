services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  webhook-ingress:
    build:
      context: ./webhook-ingress
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://triage:triage@postgres:5432/triage_agent
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      AUTONOMY_CONFIDENCE_THRESHOLD: ${AUTONOMY_CONFIDENCE_THRESHOLD:-0.85}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DRY_RUN: ${DRY_RUN:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://triage:triage@postgres:5432/triage_agent
    depends_on:
      postgres:
        condition: service_healthy

  # mcp-server has no standalone service here: worker imports it in-process
  # (see worker/pipeline.py) rather than spawning it as a separate MCP
  # stdio/network server, so its code just needs to be present inside the
  # worker image (worker/Dockerfile copies mcp-server/ alongside it).
  # `python -m mcp_server.main` (stdio transport) is for external MCP
  # clients - e.g. pointing a desktop AI app at this repo's GitHub tools -
  # not part of the always-on stack.

volumes:
  pgdata:
